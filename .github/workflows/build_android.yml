name: Build Android App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Create Standard Flutter Project & Copy Files
      run: |
        # إنشاء مشروع فلاتر مؤقت جديد بالاسم الصحيح
        flutter create temp_app --org com.family.archive --project-name family_archive
        
        # نقل ملفات التبعيات والملفات البرمجية الخاصة بك إلى المشروع الجديد
        if [ -f "pubspec.yaml" ]; then
          cp pubspec.yaml temp_app/
        fi
        
        # إنشاء مجلد lib إذا لم يكن موجوداً ونسخ الملفات إليه
        mkdir -p temp_app/lib
        cp *.dart temp_app/lib/ 2>/dev/null || true
        if [ -d "lib" ]; then
          cp -r lib/* temp_app/lib/ 2>/dev/null || true
        fi
        
        # الانتقال إلى مجلد المشروع الجديد لبدء البناء
        cd temp_app
        flutter pub get

    - name: Build APK
      run: |
        cd temp_app
        flutter build apk --release

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: family-archive-apk
        path: temp_app/build/app/outputs/flutter-apk/app-release.apk
